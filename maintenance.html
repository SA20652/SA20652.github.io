<title>GDPLAY — Технический перерыв</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:#f7f1e6}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.backdrop{position:fixed;inset:0;background:rgba(9,7,6,.90);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{position:relative;width:min(390px,100%);padding:28px 22px 24px;border:1px solid rgba(227,184,114,.22);border-radius:24px;background:linear-gradient(145deg,rgba(37,31,25,.98),rgba(20,17,14,.98));box-shadow:0 28px 90px rgba(0,0,0,.62);text-align:center;animation:enter .32s ease-out}
.cube-wrap{width:108px;height:108px;margin:0 auto 18px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(227,184,114,.20),rgba(255,255,255,.025));border:1px solid rgba(227,184,114,.25);box-shadow:inset 0 0 30px rgba(227,184,114,.08)}
.cube-wrap img{width:82px;height:82px;object-fit:contain}
.brand{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;color:#d9ad68;margin-bottom:8px}
h1{margin:0;font-size:25px;line-height:1.2;font-weight:800}
.reason{margin-top:12px;color:#c9c0b4;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.note{margin-top:16px;color:#8e857a;font-size:11px;line-height:1.45}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
</style>
